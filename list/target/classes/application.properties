# ===============================
# DATABASE (H2 - default, works out-of-the-box)
# ===============================
spring.datasource.url=jdbc:h2:file:./data/eduegy;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ===============================
# SERVER
# ===============================
server.port=8080

# ===============================
# FILE UPLOAD
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# where uploaded files will be stored (relative to project run directory)
eduegy.storage.base-dir=uploads

# ===============================
# THYMELEAF
# ===============================
spring.thymeleaf.check-template-location=false
